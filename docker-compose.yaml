services:
  app-go:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: api-projeto-korp
    restart: always
    networks:
      - rede-projeto-korp

  nginx:
    image: nginx:1.30.2-alpine
    container_name: proxy-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/http-server-projeto-korp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-go
    networks:
      - rede-projeto-korp

networks:
  rede-projeto-korp:
    driver: bridge